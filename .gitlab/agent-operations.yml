# Agent operations rulebook — the single source of truth for the opencode-ci tail.
#
# WHY THIS FILE EXISTS. The chat agent stops at `push` (doctrine LAW 2). Everything
# to the right of that arrow — merge, reap, mirror, release — happens in CI, without a
# human in the loop. A loop with no written rules is a loop nobody can audit, and an
# audit trail that only exists in a commit message stops being an audit trail.
#
# This file is READ AT RUNTIME by `agent_merge`, which pulls `enabled_by` out of it with
# a two-space-indented `sed`. That means the file cannot become decorative: if it is
# absent the job refuses to act, and if the key changes the job stops acting.
#
# The structure is deliberately flat and line-oriented. A `sed -n 's/^  enabled_by: *//p'`
# is the reader; anything this file cannot express in that shape does not belong in it.

merge:
  # The CI variable that must ALSO be true. Both must agree — the rulebook expresses
  # doctrine, the variable is the per-repo switch, and neither alone is sufficient.
  enabled_by: AGENT_MERGE
  # Two gates, both required, and the second is not optional:
  #   1. the pipeline on the MR HEAD sha is green — a green run id is a RECORD, not a
  #      permission, so it is re-checked at merge time rather than trusted from the event;
  #   2. reconciliation — every agent-produced card the MR claims to close is actually in
  #      a terminal state.
  # A merge with only gate 1 is a merge nobody reconciled, and this project has shipped
  # "the agent said it was done" more than once.
  require_green_pipeline: true
  require_reconciliation: true
  # GitLab's native auto-merge and required-approvals are Premium on this instance, so
  # both gates are enforced by the script rather than by a branch-protection flag.
  # `main` is NOT protected either, which is precisely why the script re-checks instead
  # of trusting a flag.
  min_gates: 2

reap:
  # Deleting a branch is irreversible on the remote. A branch is reaped ONLY when it is
  # already mirrored to GitHub AND carries a merged MR. The mirror-first interlock is the
  # whole safety property: if GitHub does not have the branch, deleting it in GitLab
  # loses work, and the operator's stated requirement is that GitLab can be deleted at
  # any time without losing anything.
  enabled_by: AGENT_REAP
  require_mirrored_to_github: true
  require_merged_mr: true
  # A branch whose name touches the live line is never reaped by an agent, whatever the
  # gates say. This is the operator's red line, and it is a human-only decision.
  never_reap_name_matching: 'live|production'

mirror:
  enabled_by: AGENT_MIRROR
  # GitLab is the source of truth, so a non-fast-forward into GitHub means the two have
  # DIVERGED and a human must look. It is never a silent overwrite, and never a force.
  # The operator currently has a real 130-commit divergence on MeRezaRezaei/ui2api, and
  # that divergence existing is the correct behaviour of this rule, not a bug in it.
  no_force: true
  no_prune: true
  # `.brain` carries the operator's complete unedited transcripts. If the destination
  # repository is not private the brain is DIVERTED to a dedicated private repository
  # instead — and the job REFUSES if no private destination exists, rather than
  # silently dropping it. Visibility is checked at runtime, never assumed, because a
  # repository can be flipped public after the fact.
  brain_dir: .brain
  brain_divert_when_destination_public: true
  brain_repo: MeRezaRezaei/operator-brain

release:
  # A GitHub Release is the durable record of what was built and deployable. The reason
  # is the operator's: the self-hosted GitLab VPS may be deleted, so the code and a
  # deployable artifact must both survive on GitHub.
  enabled_by: AGENT_MERGE
  # A tag that moves cannot answer "what was deployed on Tuesday", so a tag is written
  # once and never forced.
  immutable_tags: true
  tag_prefix: build-
# ===========================================================================
# THE PUBLIC/PRIVATE DOCTRINE — added 2026-10-05 at the operator's instruction
# ===========================================================================
#
# MEASURED STATE at the time of writing (all of it read, none of it assumed):
#
#   github.com/MeRezaRezaei/ui2api        PUBLIC   781 commits, 33 .brain files,
#                                                     214 commits carry the corpus
#   github.com/MeRezaRezaei/ui2api-full   PRIVATE    1 commit  (sanitised export)
#   gitlab.pubg-sell.ir/…/ui2api          (working) the source of truth
#
# ! THE NAMING IS INVERTED RELATIVE TO THE INTENT, AND THAT IS THE POINT THAT
# ! WAS MISSED. Read the two rows again:
#
#   The PUBLIC repo holds the FULL 781-commit history WITH the corpus.
#   The PRIVATE "full" repo holds ONE sanitised commit.
#
# `ui2api-full` is named for what it SHOULD hold — the complete history — and
# today it holds a sanitised single commit, while the public repo holds the
# complete history and the corpus with it. A reader trusting the NAME would
# conclude the private repo is safe and the public one is clean. Both inferences
# are false. This is recorded here because a doctrine that cannot be checked
# against a measurement is a doctrine nobody can enforce.
#
# ---------------------------------------------------------------------------
# 1. EVERY PUBLIC GITHUB PROJECT HAS A PRIVATE TWIN. THERE IS NO EXCEPTION.
# ---------------------------------------------------------------------------
# The pair is the design, and the two halves are not interchangeable:
#
#   PRIVATE twin   the durability record. Complete history, every original commit
#                  hash, `.brain` and all. This is what makes deleting the
#                  self-hosted GitLab VPS cost nothing.
#   PUBLIC repo    the same project with any brain removed from its HISTORY.
#
# The split is history-preserving on purpose: the two halves share a common
# ancestor and a commit-map, so the full repo can be reconstructed later. A tip-
# only strip does NOT achieve this — it drops the other commits entirely.
#
# 2. GITLAB IS THE WORKING MACHINE; GITHUB IS THE ARCHIVE.
#   Branches and worktrees are created and pruned in GitLab constantly, because
#   the host is low on storage and is meant to be transient. A branch leaves
#   GitLab only after its tip is already on GitHub — "merged" is not a substitute
#   for "backed up". GitHub is never pruned and never force-pushed.
#
# 3. THE PUBLIC PUSH IS THE ONE FORCE-PUSH, AND IT IS DELIBERATE.
#   A sanitised history is a rewrite by definition: the same commits with brain
#   paths removed, so every hash changes. This is the ONLY force-push permitted
#   in this project, scoped to the public repo, and only after verification
#   passes. Everywhere else, `no_force: true` above stands.
#
# 4. A PUBLIC REPO'S HISTORY CANNOT BE UN-PUBLISHED. ONLY REWRITTEN.
#   And a rewrite does not reach forks, clones, or anyone who already fetched.
#   So the strip must be right the FIRST time. This is why the gate is
#   fail-closed rather than best-effort, and why "it was already pushed" is
#   never an acceptable reason to lower a check.
#
# 5. `.brain` IS PRIVATE INTELLECTUAL PROPERTY AND NEVER GOES TO A PUBLIC REPO.
#   Not at the tip, not in history, not quoted inside a file with an innocent
#   path. It is the operator's own unedited words, internal infrastructure, and
#   decisions not yet public.
#
# 6. THE SANITISER OWNS THE EXCLUSION LIST; NOBODY ELSE GETS A VOTE.
#   scripts/ci/public-repo-paths.txt is derived from
#   `git rev-list --all --objects` — every path that has EVER existed — and each
#   entry is classified by CONTENT, not by name. It is reviewable precisely
#   because it is a file and not a heredoc. The kit does not sanitise trees; the
#   exclusion list is project policy and policy does not live in a shared
#   component.
#
# 7. A GATE THAT CANNOT OPEN IS NOT A GATE.
#   The marker `/tmp/mirror-work/public-verified` is written ONLY on the
#   sanitiser's own exit status. A job that prints "VERDICT: PASS" and then
#   withholds the push because it tested for a marker nothing wrote is worse
#   than no gate, because it looks like protection. Measured: pipeline 1114 did
#   exactly that for hours.
#
# ---------------------------------------------------------------------------
# 8. THE CURRENT BLOCKER, recorded because it is NOT a sanitiser problem.
# ---------------------------------------------------------------------------
# The public copy has not been republished because `public_mirror` never RAN.
# Its `needs: ["verify"]` was unmet: `verify` fails on an unrelated
# documentation-truth assertion in test/skills-truth.test.ts (two `/data`
# path tokens claimed in skills/ui2api-operate/SKILL.md with no matching
# registered route). Pipeline 1552 shows public_mirror `skipped`, verify
# `failed`.
#
# So the corpus is exposed for a reason that has nothing to do with the corpus:
# an unrelated red gate is holding the publisher hostage. That coupling is a
# defect. `public_mirror` sanitises and verifies INDEPENDENTLY of the project's
# test suite — a doc-truth failure is not evidence that the sanitiser is unsafe,
# and it must never be able to block publication of a privacy fix.
