# ui2api profile — GitLab is the CI/CD actor; GitHub is long-term storage + release.
#
# The operator's intent, verbatim in intent: "if i want to delete the vps of it the
# full codes and developments are inside github safe". So GitHub must carry the code
# and the release, and .brain must NOT travel with a public code repo — it goes to a
# dedicated PRIVATE repo shared by all the operator's projects.

project: ui2api
gitlab_path: MeRezaRezaei/ui2api
gitlab_host: gitlab.pubg-sell.ir
gitlab_path_encoded: MeRezaRezaei%2Fui2api

github_repo: MeRezaRezaei/ui2api

# THE SHARED BRAIN REPO. One private repo for EVERY project the operator owns, so a
# public code repo can never carry the verbatim corpus.
github_brain_repo: MeRezaRezaei/operator-brain
brain_dir: .brain

# ui2api has ONE live tree (/opt/ui2api) — there is no dev/production split here, and
# inventing one would be a guard guarding nothing. deploy_ref stays main because main
# is the only ref allowed to ship.
live_app_path: /opt/ui2api
dev_app_path: /opt/ui2api
live_branch: main
deploy_ref: main
integration_branch: main

runner_tag: ui2api

variables:
  OPENCODE_AGENT: "true"
  OPENCODE_AGENT_FIX: "true"
  AGENT_MERGE: "true"
  AGENT_REAP: "true"
  AGENT_MIRROR: "true"
  OPENCODE_ALLOW_PIPELINE: "false"

install:
  # OFF, with reason: ui2api has no separate live branch. live_branch would have to
  # equal the integration branch, and a guard that watches its own branch fails
  # every pipeline for ever. See the note above.
  red_line_guard: false
  opencode_pair: true
  opencode_fix_ci: true
  opencode_preflight: true
  agent_merge: true
  agent_reap: true
  # OFF, with reason. public_mirror SUPERSEDES it for this project.
  #
  # MEASURED on pipeline 947: the kit's mirror_to_github ran for the first time
  # (it had been inert — no OMNIROUTE_API_KEY/GH_TOKEN) and did its job exactly
  # right: it verified the destination is PRIVATE, counted 2 branches and 5 tags,
  # and then REFUSED to push because GitHub's main holds work we do not have —
  #   ! [rejected]  origin/main -> main (fetch first)
  # That is the no-force rule doing its job, and it is right in the abstract.
  #
  # But this project has TWO mirrors with OPPOSITE force semantics writing to the
  # SAME repo: the kit's never forces (a human looks at a divergence), and
  # public_mirror forces for the sanitized copy (because stripping paths rewrites
  # every hash, so a non-fast-forward there is the intended operation, not an
  # anomaly). Two jobs fighting over one remote is a design collision, and the
  # loser's failure is noise that trains people to ignore red.
  #
  # public_mirror handles both halves with the right semantics each: the private
  # full copy WITHOUT force, the public sanitized copy WITH force and hard-gated
  # on a clean verification. So the kit's mirror is redundant here, not wrong.
  mirror_to_github: false
