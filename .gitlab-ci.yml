# ui2api CI — GitLab (gitlab.pubg-sell.ir)
#
# MEASURED FAILURE worth keeping in mind: pipeline 173 (job 314) FAILED with
# "ERROR: Uploading artifacts as archive to coordinator... 413 Payload Too Large"
# -> "FATAL: too large". The build job was uploading the cloned wigolo tree
# (node_modules + its own Playwright chromium) as a job artifact. Each job now
# does its own checkout and NOTHING large is uploaded. Do not re-add a
# node_modules/chromium artifact here.
#
# The long-run suite lives HERE, on the GitLab runner, and NOT on a developer's
# box. The full unit suite, the build and the integration run are too heavy for a
# shared machine; local verification is per-file and bounded (see AGENTS.md).
#
# The same gate chain as the historical GitHub workflow, expressed for GitLab:
#   npm ci -> playwright chromium -> npm run build -> check:verbatim*
#   -> npm test (integration) -> npm run test:unit (full unit suite)
#
# The wigolo daemon tier (test/wigolo-engine.test.ts) spawns a local daemon from a
# repo checkout and drives it over loopback, so it needs ITS OWN pinned upstream
# and its own chromium revision (1223, distinct from the main suite's).

stages:
  - build
  - verify
  - deploy

variables:
  CI_NODE_VERSION: "24"
  # The verbatim corpus gates are part of the human-free chain: a change that
  # leaves .brain/ inconsistent must fail the pipeline, not a person.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

concurrent: 2

cache:
  key:
    files:
      - package-lock.json
    # Cache keys are NOT project-scoped by default: without this prefix the
    # lockfile-hash key collides with the other CI projects on the shared
    # runner, and one project's cache can be served to (or evicted by) another.
    prefix: "ui2api"
  paths:
    # node_modules/ is deliberately NOT cached. It is rebuilt by `npm ci` in
    # every job anyway, and caching it is what blew the runner cache cap
    # (1 GiB docker / 512 MiB shell) and produced the measured
    # "413 Payload Too Large" upload failure. Do not re-add it.
    - .npm/

# The wigolo engine tests need a checkout at $WIGOLO_REPO.
before_script:
  - apt-get update -qq && apt-get install -y -qq git >/dev/null
  - node --version

build:
  stage: build
  # Pin the LTS image: the wigolo daemon's pinned playwright supports ubuntu-24.04
  # but not a rolled-forward image — its chromium installer refuses unlisted distros.
  image: node:24-bookworm
  timeout: 30m
  retry: 1
  interruptible: true
  allow_failure: false
  cache:
    key:
      files: [package-lock.json]
      # Same project-unique key as the top-level cache. This job-level block
      # REPLACES the top-level one, so the prefix has to be repeated here or
      # the key goes back to being un-namespaced.
      prefix: "ui2api"
    # Sole writer for this key. `verify` runs pull-only, so a pipeline uploads
    # the cache once instead of twice (the default pull-push had both jobs
    # re-uploading the same archive).
    policy: pull-push
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright install --with-deps chromium
    # wigolo upstream, pinned to a verified commit, with ITS deps and ITS chromium
    - .gitlab/fetch-wigolo.sh "$CI_PROJECT_DIR/wigolo" d69bf773be06f29fc1d335f8ba35ec88457ac707
    - cd "$CI_PROJECT_DIR/wigolo" && npm ci && npx playwright install chromium
    - cd "$CI_PROJECT_DIR" && npm run build
    # GOAL 147: typecheck the TESTS too. `npm run build` only compiles src/ —
    # tsconfig.json excludes test/ — so a test fixture could omit a field its
    # interface declares REQUIRED and nothing would notice until CI ran it on a
    # different machine. That is exactly how pipeline 199 went red: a fixture
    # that omitted two seams read the real host (933 fonts here, none on a bare
    # runner). The backlog this surfaced is now zero, so it is safe to gate.
    - cd "$CI_PROJECT_DIR" && npm run typecheck

verify:
  stage: verify
  image: node:24-bookworm
  timeout: 30m
  interruptible: true
  needs: ["build"]
  dependencies: []
  cache:
    key:
      files: [package-lock.json]
      # Must match build's key exactly to read what build wrote; repeated here
      # because this job-level block replaces the top-level cache definition.
      prefix: "ui2api"
    # Reader only. Without this, verify re-uploaded the identical archive that
    # build had just uploaded — double the cache I/O for no benefit.
    policy: pull
    paths: [.npm/]
  variables:
    WIGOLO_REPO: "$CI_PROJECT_DIR/wigolo"
    UI2API_REGISTRY_LIVE: "1"
    # GOAL 147: the credential-leak gate's live half shells out to `gh`. It is
    # opt-in (UI2API_GH_LIVE=1) so the unit suite never depends on the network,
    # exactly like the registry knob above; without it the offline half still holds
    # the line and the live half skips with a named reason.
    UI2API_GH_LIVE: "1"
  script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright install --with-deps chromium
    # Its own wigolo checkout. NOT passed as an artifact: node_modules plus a
    # Playwright chromium build are hundreds of MB and uploading them 413s
    # (measured: pipeline 173 job 314 died on "413 Payload Too Large").
    - .gitlab/fetch-wigolo.sh "$CI_PROJECT_DIR/wigolo" d69bf773be06f29fc1d335f8ba35ec88457ac707
    - cd "$CI_PROJECT_DIR/wigolo" && npm ci && npx playwright install chromium
    - cd "$CI_PROJECT_DIR"
    # The verbatim-completeness gate (P1..P5) is part of the human-free chain.
    - npm run check:verbatim
    - npm run check:verbatim:goals
    - npm test
    - npm run test:unit

# ---------------------------------------------------------------- deploy ----
#
# Every push to main updates the RUNNING app on this box. That is the whole
# point: the known failure this fixes is a daemon left over from an older
# commit, still answering /registry happily while 404ing every route added
# since — code on disk that is not the code you are talking to.
#
# This job runs on a SHELL-EXECUTOR runner (`tags: [deploy]`), not the docker
# one. That is deliberate and load-bearing: a docker-executor job cannot reach
# the host's systemd, so a deploy from there could not restart anything, and a
# deploy that cannot restart the service is a no-op with extra steps. The shell
# runner is `run_untagged: false` and locked, so only a `deploy`-tagged job in
# this project can land on this machine.
#
# It runs ONLY after verify is green. A red suite must never reach /opt.
deploy:
  stage: deploy
  tags: [deploy]
  # Long enough for npm ci + tsc + install + restart + health check on a real box.
  timeout: 20 minutes
  interruptible: false
  needs: ["verify"]
  dependencies: []
  resource_group: ui2api-production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "deploying $CI_COMMIT_SHA to /opt/ui2api on $CI_RUNNER_DESCRIPTION"
    # One script, so the manual path and the CI path cannot drift apart. It
    # builds BEFORE switching over, restarts, and FAILS if /health does not
    # answer — a green pipeline with a dead service is the exact failure this
    # job exists to prevent.
    - sudo ./scripts/ops/deploy.sh
    - |
      echo "--- post-deploy verification ---"
      curl -fsS --max-time 5 http://127.0.0.1:9797/health
      echo
      echo "packages: $(curl -fsS --max-time 5 http://127.0.0.1:9797/registry | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).packages.length))')"
      echo "models:   $(curl -fsS --max-time 5 http://127.0.0.1:9797/v1/models  | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).data.length))')"
      systemctl is-active ui2api-api
